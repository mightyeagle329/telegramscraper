# Outpilot — Fly.io deployment template.
#
# Setup (one-time, after the client signs up at fly.io with the new email):
#
#   1. Install flyctl:        curl -L https://fly.io/install.sh | sh
#   2. Authenticate:          fly auth login
#   3. Create the app:        fly launch --no-deploy --name outpilot --copy-config
#                              (use existing fly.toml when prompted)
#   4. Create state volume:   fly volumes create outpilot_state --region iad --size 3
#   5. Set secrets (each value below — get from your local .env):
#        fly secrets set TELEGRAM_API_ID=... TELEGRAM_API_HASH=... TELEGRAM_PHONE=+1...
#        fly secrets set OPENAI_API_KEY=sk-...
#        fly secrets set SCRAPER_PROXY_HOST=... SCRAPER_PROXY_PORT=... SCRAPER_PROXY_USERNAME=... SCRAPER_PROXY_PASSWORD=...
#        fly secrets set ENGAGEMENT_BOT_TOKEN=... ENGAGEMENT_BOT_CHAT_ID=... ENGAGEMENT_BOT_SHEET_ID=...
#        fly secrets set FRONTEND_URL=https://outpilot.vercel.app
#        # Google Sheets creds — base64-encode each file and set as a secret:
#        fly secrets set GOOGLE_CREDENTIALS_B64="$(base64 -w0 backend/credentials.json)"
#        fly secrets set GOOGLE_TOKEN_B64="$(base64 -w0 backend/token.json)"
#   6. Deploy:                fly deploy
#
# Updates: just `fly deploy` after pushing code. State on the volume survives.

app = "outpilot"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8000"
  GOOGLE_CREDENTIALS_FILE = "/data/credentials.json"
  # The backend writes to relative paths today; the entrypoint symlinks
  # /data/<file> → /app/<file> on boot so existing code "just works."

[mounts]
  source = "outpilot_state"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # the engagement bot + group tracker need 24/7
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  protocol = "http"
  timeout = "5s"

# Smallest VM that comfortably runs Telethon + APScheduler + bot listener.
# Bump to 1gb if AI generation for big campaigns OOMs.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Fly.io deployment config for the Python backend.
#
# Rename the `app` field after running `flyctl launch` — Fly will also generate
# one automatically and ask you to pick a globally-unique name.
#
# This config keeps one VM up 24/7 (auto_stop/min_machines) because the
# Telethon MTProto session should not be torn down between requests.

app = "telegram-outreach-api"          # <-- change after `flyctl launch`
primary_region = "fra"                  # <-- pick closest region

kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # Make sure Python reads state from the persistent volume.
  # The Dockerfile's entrypoint symlinks these into /app, so no code change
  # is required to `main.py`.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false             # keep worker alive for long-lived Telethon sessions
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[services.ports]]
  port = 443
  handlers = ["tls", "http"]

# Persistent volume for Telethon sessions + JSON state files.
# Create once with: flyctl volumes create telegram_data --size 1 --region fra
[mounts]
  source = "telegram_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
